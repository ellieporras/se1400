<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentic Vintage Apparel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="grid-wrapper">
        <header class="main-header">
            <nav class="nav-left">
                <a href="#">Home</a>
                <a href="#">About Us</a>
                <a href="#">Trends</a>
            </nav>
            
            <div class="logo-area">
                <img src="logo.png" alt="Authentic Vintage Apparel">
            </div>

            <nav class="nav-right">
                <a href="#">Find Your Colors</a>
                <a href="#">Inspration</a> 
            </nav>
        </header>

        <section class="fit-checker">
            <h1>FIT CHECKER</h1>
        </section>

        <main class="hero-section">
            <div class="hero-content">
                <div class="style-box">
                    <h2>FIND YOUR STYLE</h2>
                </div>
            </div>
        </main>

        <section class="product-container">
            <div class="product-card">
                <div class="card-image"><img src="item1.jpg" alt="Vintage Style 1"></div>
                <div class="card-label">Lorem Ipsum</div>
            </div>
            <div class="product-card">
                <div class="card-image"><img src="item2.jpg" alt="Vintage Style 2"></div>
                <div class="card-label">Lorem Ipsum</div>
            </div>
            <div class="product-card">
                <div class="card-image"><img src="item3.jpg" alt="Vintage Style 3"></div>
                <div class="card-label">Lorem Ipsum</div>
            </div>
        </section>

        <footer class="main-footer">
            <div class="phone-number">435-222-2222</div>
            <div class="social-icons">
                <img src="snapchat.png" alt="Snapchat">
                <img src="instagram.png" alt="Instagram">
                <img src="tiktok.png" alt="TikTok">
            </div>
        </footer>
    </div>

</body>
</html>
