<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fit Checker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="wrapper">

    <header>
      <nav class="nav-left">
        <button>Home</button>
        <button>About Us</button>
        <button>Trends</button>
      </nav>

      <div class="logo">
        <img src="images/logo.png" alt="Authentic Vintage Apparel logo" />
      </div>

      <nav class="nav-right">
        <button>Find Your Colors</button>
        <button>Inspiration</button>
      </nav>
    </header>

    <section class="title">
      <h2>FIT CHECKER</h2>
    </section>

    <section id="hero">
      <div class="left-hero">
        <img src="images/clothes1.jpg" alt="Flat lay clothes" />
      </div>
      <div class="right-hero">
        <img src="images/clothes2.jpg" alt="People fashion" />
      </div>
      <div class="hero-box">
        <h1>FIND YOUR STYLE</h1>
      </div>
    </section>

    <section class="cards">
      <div class="card">
        <img src="images/style1.jpg" alt="Style 1" />
        <button>Lorem Ipsum</button>
      </div>
      <div class="card">
        <img src="images/style2.jpg" alt="Style 2" />
        <button>Lorem Ipsum</button>
      </div>
      <div class="card">
        <img src="images/style3.jpg" alt="Style 3" />
        <button>Lorem Ipsum</button>
      </div>
    </section>

    <footer>
      <div class="phone">435-222-2222</div>
      <div class="social-icons">
        <img src="images/snapchat.png" alt="Snapchat icon" />
        <img src="images/instagram.png" alt="Instagram icon" />
        <img src="images/tiktok.png" alt="TikTok icon" />
      </div>
    </footer>

  </div>

</body>
</html>
